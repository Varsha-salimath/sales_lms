# Sales LMS — single Compose (local + prod). Only .env values change.
#
# Local (embedded MySQL via COMPOSE_PROFILES=embedded-db):
#   cp .env.example .env
#   docker compose --env-file .env build backend
#   docker compose --env-file .env build frontend
#   docker compose --env-file .env up -d
#
# Prod: clear COMPOSE_PROFILES; set DB_HOST to AWS MariaDB/MySQL-compatible host; same build/up commands.
#
# Health: curl http://127.0.0.1:${APP_PORT}/api/method/ping
#
# Build frontend AFTER backend (Dockerfile.frontend FROM backend image).
# PRODUCTION: APP_PORT=8080 (LB → VM:8080). Local may use 8081 if 8080 is busy.

name: sales_lms

services:
  db:
    # Started only when COMPOSE_PROFILES includes embedded-db (local default).
    profiles: ["embedded-db"]
    image: mariadb:10.11
    container_name: sales_lms_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$$MARIADB_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - sales_net
    restart: unless-stopped
    volumes:
      - sales_db_data:/var/lib/mysql
      - type: bind
        source: ./docker/mysql/frappe.cnf
        target: /etc/mysql/conf.d/frappe.cnf
        read_only: true

  redis:
    image: redis:7-alpine
    container_name: sales_lms_redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    networks:
      - sales_net
    restart: unless-stopped
    volumes:
      - sales_redis_data:/data

  backend:
    image: ${BACKEND_IMAGE:-sales-lms-backend:local}
    pull_policy: ${LMS_PULL_POLICY:-never}
    platform: linux/amd64
    container_name: sales_lms_backend
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    entrypoint: ["bash", "/workspace-docker/entrypoint-backend.sh"]
    environment:
      SITE_NAME: ${SITE_NAME:-sales.localhost}
      HOST_NAME: ${HOST_NAME:-http://localhost:8080}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_TYPE: ${DB_TYPE:-mariadb}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-salesapp}
      DB_USER: ${DB_USER:-salesapp}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_ROOT_USERNAME: ${DB_ROOT_USERNAME:-root}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      DB_USE_SSL: ${DB_USE_SSL:-}
      DB_SSL_CA: ${DB_SSL_CA:-/home/frappe/.aws/rds-global-bundle.pem}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_CACHE: ${REDIS_CACHE:-}
      REDIS_QUEUE: ${REDIS_QUEUE:-}
      REDIS_SOCKETIO: ${REDIS_SOCKETIO:-}
      SOCKETIO_PORT: ${SOCKETIO_PORT:-9000}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      SMTP_TLS: ${SMTP_TLS:-1}
      SMTP_SSL: ${SMTP_SSL:-0}
      DEFAULT_SENDER: ${DEFAULT_SENDER:?Set DEFAULT_SENDER in .env}
      DEFAULT_SENDER_NAME: ${DEFAULT_SENDER_NAME:-Sales LMS}
      DEVELOPER_MODE: ${DEVELOPER_MODE:-0}
      LMS_ALLOW_GUEST_ACCESS: ${LMS_ALLOW_GUEST_ACCESS:-}
      LMS_DISABLE_SIGNUP: ${LMS_DISABLE_SIGNUP:-}
      ALLOW_DEMO_LEARNER: ${ALLOW_DEMO_LEARNER:-}
      DEMO_LEARNER_PASSWORD: ${DEMO_LEARNER_PASSWORD:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENAI_API_KEY: ${GOOGLE_GENAI_API_KEY:-}
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
        required: false
    networks:
      - sales_net
    restart: unless-stopped
    volumes:
      - sales_sites:/home/frappe/frappe-bench/sites
      - type: bind
        source: ./docker
        target: /workspace-docker
        read_only: true

  frontend:
    image: ${FRONTEND_IMAGE:-sales-lms-frontend:local}
    pull_policy: ${LMS_PULL_POLICY:-never}
    platform: linux/amd64
    container_name: sales_lms_frontend
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        BACKEND_IMAGE: ${BACKEND_IMAGE:-sales-lms-backend:local}
    command: ["nginx-entrypoint.sh"]
    depends_on:
      backend:
        condition: service_started
    environment:
      BACKEND: backend:8000
      SOCKETIO: backend:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-sales.localhost}
      CLIENT_MAX_BODY_SIZE: 50m
      PROXY_READ_TIMEOUT: "120"
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
    ports:
      - target: 8080
        published: ${APP_PORT:-8080}
        protocol: tcp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/api/method/ping | grep -q pong || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - sales_net
    restart: unless-stopped
    volumes:
      - sales_sites:/home/frappe/frappe-bench/sites
      - type: bind
        source: ./docker/nginx/00-mjs-mime.conf
        target: /etc/nginx/conf.d/00-mjs-mime.conf
        read_only: true

networks:
  sales_net:
    name: sales_net
    driver: bridge

volumes:
  sales_db_data:
    name: sales_db_data
  sales_redis_data:
    name: sales_redis_data
  sales_sites:
    name: sales_sites

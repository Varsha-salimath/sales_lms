<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
	<meta name="viewport" content="width=device-width" />
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>{{ subject or "" }}</title>
</head>

{#- LMS (Infinity Learn) wrapper for every outgoing email. Overrides Frappe's
    templates/emails/standard.html. Styles are inline because most mail clients strip <style>. -#}
<body style="margin:0; padding:0; background-color:#F2F2F2; font-family:Poppins, Arial, Helvetica, sans-serif; color:#3A3E44;">
	<table class="body-table {% if header or with_container %} with-container {% endif %}" cellpadding="0" cellspacing="0" width="100%" style="background-color:#F2F2F2;">
		<tr>
			<td class="body-content" align="center" valign="top" style="padding:24px 12px;">
				<table class="email-container" border="0" cellpadding="0" cellspacing="0"
					width="{% if header or with_container %} 600 {% else %} 100% {% endif %}"
					style="max-width:600px; width:100%; background-color:#FFFFFF; border-radius:24px; overflow:hidden;">
					<tr>
						<td align="left" valign="middle" class="email-masthead" style="background-color:#FFFFFF; padding:20px 32px 16px 32px; border-bottom:3px solid #027BFF;">
							<a href="{{ site_url or 'https://saleslms.infinitylearn.com' }}" style="text-decoration:none;">
								<img
									src="https://saleslms.infinitylearn.com/assets/lms/images/il-logo-email.png"
									height="64"
									class="brand-logo"
									alt="Infinity Learn"
									style="height:64px; width:auto; border:0; display:block;"
								/>
							</a>
						</td>
					</tr>
					<tr>
						<td valign="top" class="email-title-cell" style="padding:28px 32px 0 32px;">
							{{ header or "" }}
						</td>
					</tr>
					<tr>
						<td valign="top" class="email-body-cell" style="padding:8px 32px 28px 32px;">
							<table class="email-body" border="0" cellpadding="0" cellspacing="0" width="100%"
								style="font-family:Poppins, Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#3A3E44;">
								<tr>
									<td valign="top">
										<div>{{ content }}</div>
									</td>
								</tr>
							</table>
						</td>
					</tr>
					<tr>
						<td valign="top" class="email-footer-cell {% if footer and 'with-divider' in footer %}filled{% endif %}"
							style="padding:20px 32px 28px 32px; background-color:#E6F2FF;">
							<table class="email-footer" border="0" cellpadding="0" cellspacing="0" width="100%"
								style="font-family:Poppins, Arial, Helvetica, sans-serif; font-size:12px; line-height:1.6; color:#6C6E72;">
								<tr>
									<td valign="top" data-email-footer="true">
										{{ footer }}
										<p style="margin:12px 0 0 0;">
											{{ _("LMS by Infinity Learn · This is an automated email, please do not reply.") }}<br>
											{{ _("Infinity Towers, N Convention Rd, Surya Enclave, Siddhi Vinayak Nagar, Kothaguda, Hyderabad, Telangana 500084") }}
										</p>
									</td>
								</tr>
								<tr>
									<td valign="top">
										<div class="print-html">{{ print_html or "" }}</div>
									</td>
								</tr>
							</table>
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>

</html>
